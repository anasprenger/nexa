<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Nexa Store</title>
    <link rel="stylesheet" href="style-cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div id="menuButton" class="menu-icon">
            <i class="fas fa-bars"></i>
        </div>

        <div class="logo">Nexa</div>

        <nav class="top-links">
            <a href="index.html">Página Inicial</a>
        </nav>
    </header>

    <!-- MENU LATERAL -->
    <aside id="sideMenu" class="side-menu">
        <div class="menu-header">
            <h3>Menu</h3>
            <i id="closeMenu" class="fas fa-times"></i>
        </div>

        <nav class="side-links">
            <a href="#">PERFIL <br><br> CARRINHO <br><br> FAVORITOS</a>
            <br>
            <a href="index.html">Página Inicial</a>
            <br>
            <a href="#">Seja um vendedor</a>
            <br><br>
            <a href="#">Suporte</a>
        </nav>
    </aside>

    <div class="page-wrapper">

        <div class="login-box">
            <h2 class="titulo">Criar conta</h2>

            <form class="input-group" id="registerForm">

                <label>Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required>

                <label>Email</label>
                <input type="email" id="email" placeholder="Digite seu email" required>

                <label>Senha</label>
                <input type="password" id="password" placeholder="Crie uma senha" required>

                <label>Confirmar senha</label>
                <input type="password" id="passwordConfirm" placeholder="Repita sua senha" required>

                <hr style="border: none; border-top: 1px solid #333; margin: 15px 0;">

                <h3 style="margin-bottom: 10px; color: #fff;">Endereço</h3>

                <label>CEP</label>
                <input type="text" id="cep" placeholder="00000-000" required>

                <label>Estado</label>
                <input type="text" id="estado" placeholder="Estado">

                <label>Cidade</label>
                <input type="text" id="cidade" placeholder="Cidade">

                <label>Bairro</label>
                <input type="text" id="bairro" placeholder="Bairro">

                <label>Rua</label>
                <input type="text" id="rua" placeholder="Rua">

                <label>Numero</label>
                <input type="number" id="Numero" placeholder="Numero">

                <br>

                <button type="submit" class="btn-login">Cadastrar</button>
            </form>


            <p class="register-link">
                Já tem uma conta?
                <a href="login-nexa.html">Entrar</a>
            </p>
        </div>
    </div>
    <script type="module" src="auth.js"></script>
    <script type="module" src="script-cadastro.js"></script>

</body>

</html>
