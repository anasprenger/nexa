<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Nexa</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div id="menuButton" class="menu-icon">
            <i class="fas fa-bars"></i>
        </div>

        <div class="logo">Nexa</div>

        <nav class="top-links">
            <a href="index.html">Página Inicial</a>
        </nav>
    </header>

    <!-- MENU LATERAL -->
    <aside id="sideMenu" class="side-menu">
        <div class="menu-header">
            <h3>Menu</h3>
            <i id="closeMenu" class="fas fa-times"></i>
        </div>

        <nav class="side-links">
            <a href="#">PERFIL <br><br> CARRINHO <br><br> FAVORITOS</a>
            <br>
            <a href="index.html">Página Inicial</a>
            <br>
            <a href="#">Seja um vendedor</a>
            <br><br>
            <a href="#">Suporte</a>
        </nav>
    </aside>
    <!-- CONTAINER PRINCIPAL -->
    <div class="page-wrapper">

        <div class="login-box">

            <h2 class="titulo">Entrar</h2>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="Digite seu email">
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginSenha" placeholder="Digite sua senha">
            </div>

            <button id="btnLogin" class="btn-gradiente">Entrar</button>

            <hr>

            <p class="register-link" style="display: flex;">
                Não tem uma conta? <a href="cadastro-nexa.html">Cadastre-se</a>
            </p>

        </div>
    </div>
    <script type="module" src="auth.js"></script>
    <script type="module" src="script-login.js"></script>
</body>

</html>
