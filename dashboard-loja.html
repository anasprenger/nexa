<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Nexa</title>
    <link rel="stylesheet" href="style-admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Estilos do Dashboard */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 10px 20px; border: none; background: none; cursor: pointer; font-size: 16px; font-weight: bold; color: #777; }
        .tab-btn.active { color: #0077A3; border-bottom: 3px solid #0077A3; margin-bottom: -2px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .promo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
        .promo-card { background: white; padding: 15px; text-align: center; border: 2px solid #eee; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .promo-card:hover { border-color: #0077A3; transform: scale(1.02); }
        .promo-card.selected { background-color: #e0f7fa; border-color: #0077A3; }
        .promo-percent { font-size: 20px; font-weight: bold; color: #ff329d; }

        .kpi-box { background: white; padding: 20px; border-radius: 8px; flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .kpi-value { font-size: 28px; font-weight: bold; color: #333; }

        /* ESTILOS DO MODAL (Garantia visual) */
        .modal-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none; /* Controlado pelo JS */
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-box h3 { margin-top: 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        .input-campo { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 5px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* Estilos Mini Promoção (Modal) */
        .promo-mini-grid { display: flex; gap: 5px; margin-bottom: 10px; }
        .promo-mini-btn { 
            flex: 1; 
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            background: white; 
            cursor: pointer; 
            text-align: center; 
            font-weight: bold; 
            font-size: 0.9rem;
        }
        .promo-mini-btn:hover { border-color: #0077A3; color: #0077A3; }
        .promo-mini-btn.selected { background: #0077A3; color: white; border-color: #0077A3; }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1 id="headerNomeLoja">Carregando...</h1>
        <div>
            <span id="badgeUser" style="margin-right: 15px; font-size: 12px; background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 15px;"></span>
            <button id="btnVoltar" class="btn-voltar">Sair</button>
        </div>
    </header>

    <main class="container">

        <!-- ABAS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="abrirTab('visao-geral')">Visão Geral</button>
            <button class="tab-btn" onclick="abrirTab('produtos')">Produtos</button>
            <button class="tab-btn" onclick="abrirTab('promocoes')">Promoções</button>
            <button class="tab-btn" onclick="abrirTab('configuracoes')">Configurações</button>
        </div>

        <!-- ABA 1: VISÃO GERAL -->
        <div id="visao-geral" class="tab-content active">
            <div style="display: flex; gap: 20px; margin-bottom: 30px;">
                <div class="kpi-box"><div class="kpi-value">R$ 0,00</div><div class="kpi-label">Vendas Hoje</div></div>
                <div class="kpi-box"><div class="kpi-value" id="kpiTotalProdutos">0</div><div class="kpi-label">Produtos</div></div>
            </div>
            <h3>Atalhos</h3>
            <button class="btn btn-gerenciar" onclick="abrirTab('produtos')">Gerenciar Produtos</button>
            <button class="btn btn-ativar" onclick="abrirTab('promocoes')">Criar Promoção</button>
        </div>

        <!-- ABA 2: PRODUTOS -->
        <div id="produtos" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>Catálogo</h3>
                <button class="btn btn-ativar" style="width: auto;" id="btnAddProduto"><i class="fas fa-plus"></i> Novo Produto</button>
            </div>
            <table class="admin-table">
                <thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Promoção</th><th>Ações</th></tr></thead>
                <tbody id="listaProdutos"></tbody>
            </table>
        </div>

        <!-- ABA 3: PROMOÇÕES -->
        <div id="promocoes" class="tab-content">
            <div class="admin-card">
                <h3>Aplicar Desconto em Massa</h3>
                <p>Escolha onde aplicar:</p>
                <select id="promoEscopo" class="input-campo" style="width: 100%; padding: 10px;">
                    <option value="tudo">Toda a Loja</option>
                    <optgroup label="Por Categoria" id="optCategorias"></optgroup>
                </select>

                <p style="margin-top: 15px;">Escolha o desconto:</p>
                <div class="promo-grid">
                    <div class="promo-card" onclick="selectPromo(10)"><div class="promo-percent">10%</div></div>
                    <div class="promo-card" onclick="selectPromo(30)"><div class="promo-percent">30%</div></div>
                    <div class="promo-card" onclick="selectPromo(50)"><div class="promo-percent">50%</div></div>
                    <div class="promo-card" onclick="selectPromo(70)"><div class="promo-percent">70%</div></div>
                </div>

                <div style="margin-top: 30px; text-align: right;">
                    <button class="btn btn-desativar" style="width: auto;" id="btnRemoverPromo">Remover Todas</button>
                    <button class="btn btn-ativar" style="width: auto;" id="btnAplicarPromo">APLICAR</button>
                </div>
            </div>
        </div>

        <!-- ABA 4: CONFIGURAÇÕES -->
        <div id="configuracoes" class="tab-content">
            <div class="admin-card">
                <h3>Dados da Loja</h3>
                <form id="formConfigLoja">
                    <label>Nome</label><input type="text" id="confNome" class="input-campo">
                    <label>Descrição</label><textarea id="confDesc" class="input-campo"></textarea>
                    <button type="submit" class="btn btn-gerenciar">Salvar</button>
                </form>
            </div>
        </div>

    </main>

    <!-- MODAL EDITAR PRODUTO -->
    <div class="modal-bg" id="modalEditar">
        <div class="modal-box">
            <h3>Editar Produto</h3>
            <form id="formEditarProduto">
                <input type="hidden" id="editId">
                
                <label>Nome do Produto</label>
                <input type="text" id="editNome" class="input-campo" required>

                <div style="display: flex; gap: 10px;">
                    <div style="flex:1;">
                        <label>Preço (R$)</label>
                        <input type="number" id="editPreco" class="input-campo" step="0.01" required>
                    </div>
                    <div style="flex:1;">
                        <label>Categoria</label>
                        <select id="editCategoria" class="input-campo" required>
                            <!-- Preenchido via JS -->
                        </select>
                    </div>
                </div>

                <label>Descrição</label>
                <textarea id="editDescricao" class="input-campo" style="height: 60px;"></textarea>

                <!-- ÁREA DE PROMOÇÃO INDIVIDUAL -->
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee; margin-top: 10px;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                        <input type="checkbox" id="editPromoAtiva" style="width: 18px; height: 18px;">
                        <label for="editPromoAtiva" style="margin:0; font-weight:bold; color: #0077A3;">Ativar Promoção neste Produto</label>
                    </div>
                    
                    <div id="editPromoOptions" style="display: none;">
                        <label style="font-size: 0.9rem;">Porcentagem de Desconto:</label>
                        <div class="promo-mini-grid">
                            <div class="promo-mini-btn" onclick="setEditPromo(10)">10%</div>
                            <div class="promo-mini-btn" onclick="setEditPromo(30)">30%</div>
                            <div class="promo-mini-btn" onclick="setEditPromo(50)">50%</div>
                            <div class="promo-mini-btn" onclick="setEditPromo(70)">70%</div>
                        </div>
                        <input type="number" id="editPromoPercent" class="input-campo" placeholder="Outro % (ex: 15)" style="margin-bottom: 0;">
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancelar-btn" onclick="fecharModalEditar()">Cancelar</button>
                    <button type="submit" class="salvar-btn">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="dashboard-loja.js"></script>
    <script>
        function abrirTab(id) {
            document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
